<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOIR</title>
<meta name="theme-color" content="#0a0a10">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0a0a10;--bg-card:#17151f;--bg-input:#0d0c13;--bg-hover:#211e2d;--text:#f2eef9;--text-2:#9a94b0;--text-3:#5d5873;--border:#2a2738;--accent:#9370ff;--ok:#5fd38d;--bad:#ef6b73;--warn:#f0b429;--font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:15px/1.55 var(--font);color:var(--text);min-height:100dvh;background:radial-gradient(900px 520px at 75% -12%,color-mix(in srgb,var(--accent) 18%,transparent),transparent),var(--bg)}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* bố cục: thẻ hồ sơ bên trái (dính), nội dung bên phải */
.page{display:grid;grid-template-columns:340px minmax(0,1fr);gap:28px;max-width:1040px;margin:0 auto;padding:36px 20px 64px;align-items:start}
.side{position:sticky;top:28px}
#prof{background:var(--bg-card);border:1px solid var(--border);border-radius:22px;padding:12px 14px 22px}
.foot{color:var(--text-3);font-size:13px;text-align:center;margin-top:14px}
.content{min-width:0}

/* tab có thanh trượt */
.tabs{position:relative;display:inline-flex;gap:2px;padding:4px;background:var(--bg-card);border:1px solid var(--border);border-radius:99px;margin-bottom:18px}
.tab{position:relative;z-index:1;background:none;border:0;padding:8px 20px;border-radius:99px;color:var(--text-2);font-weight:500;overflow:hidden;transition:color .2s}
.tab.active{color:#fff}
.ind{position:absolute;z-index:0;top:4px;bottom:4px;left:0;width:var(--w,0);transform:translateX(var(--x,0));border-radius:99px;background:var(--accent)}
.tabs.ready .ind{transition:transform .35s cubic-bezier(.3,.8,.2,1),width .35s cubic-bezier(.3,.8,.2,1)}

/* hiệu ứng chung: xuất hiện lần lượt, gợn sóng khi bấm, vệt sáng theo con trỏ */
.rv{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.rp{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:color-mix(in srgb,var(--accent) 45%,transparent);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none;z-index:0}
@keyframes rip{to{transform:scale(1);opacity:0}}
.sp::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--bc,var(--accent)) 24%,transparent),transparent 62%)}
.sp:hover::before{opacity:1}
.sp>:not(.ripple){position:relative;z-index:1}

/* link mạng xã hội */
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.link{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--bg-card);border:1px solid var(--border);text-align:left}
.link:hover{transform:translateY(-2px)}
.lk-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:20px;background:color-mix(in srgb,var(--bc,var(--accent)) 18%,transparent)}
.lk-tx{display:flex;flex-direction:column;min-width:0;flex:1}.lk-tx b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk-tx small{color:var(--text-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk-ar{color:var(--text-3);transition:transform .2s,color .2s}.link:hover .lk-ar{transform:translate(2px,-2px);color:var(--text)}

/* card script */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.wrap .scard,.scard{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;cursor:pointer;text-align:left;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .2s}
.scard:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--accent) 55%,var(--border));box-shadow:0 16px 40px -14px color-mix(in srgb,var(--accent) 50%,transparent)}
.sthumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--bg-hover)}
.sthumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.scard:hover .sthumb img{transform:scale(1.07)}
.sthumb::after{content:"";position:absolute;inset:auto 0 0 0;height:50%;background:linear-gradient(transparent,rgba(10,8,16,.7));pointer-events:none}
.sph{width:100%;height:100%;display:grid;place-items:center;color:color-mix(in srgb,var(--accent) 70%,#fff);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 35%,#14121c),#14121c)}.sph .i{width:34px;height:34px}
.sthumb .badge{position:absolute;top:10px;left:10px;z-index:2;background:rgba(10,8,16,.65);backdrop-filter:blur(6px)}
.sbody{padding:14px 16px 16px}
.sbody h3{font-size:17px;font-weight:600;line-height:1.3}
.smeta{color:var(--text-2);font-size:13px;margin-top:2px}
.sdesc{color:var(--text-2);font-size:14px;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sstats{display:flex;gap:14px;color:var(--text-2);font-size:13px;margin-top:12px}.sstats span{display:inline-flex;align-items:center;gap:5px}
.sact{display:flex;gap:8px;margin-top:14px}.sact .btn{flex:1}
.badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid;white-space:nowrap}
.badge.working{color:var(--ok);border-color:rgba(95,211,141,.45)}.badge.patched{color:var(--bad);border-color:rgba(239,107,115,.45)}.badge.outdated{color:var(--warn);border-color:rgba(240,180,41,.45)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;background:var(--bg-hover);border:1px solid var(--border);font-weight:600;font-size:14px}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 60%,var(--border))}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{filter:brightness(1.12)}
.btn.small{padding:8px 12px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.card-head h3{font-size:19px}
.meta{color:var(--text-2);font-size:13px;margin-top:4px}.desc{color:var(--text-2);margin:10px 0}
.empty{color:var(--text-3);text-align:center;padding:40px 12px;border:1px dashed var(--border);border-radius:16px}

/* popup */
dialog{margin:auto;background:var(--bg-card);color:var(--text);border:1px solid var(--border);border-radius:22px;padding:0;width:min(540px,calc(100% - 24px));max-height:calc(100dvh - 32px);overflow:auto}
dialog[open]{animation:pop .26s cubic-bezier(.2,.9,.3,1.1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
dialog::backdrop{background:rgba(5,4,10,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
#dbody{padding:20px;position:relative}
#dbody .card-head{padding-right:40px}
.dimg{display:block;width:calc(100% + 40px);margin:-20px -20px 16px;aspect-ratio:16/9;object-fit:cover}
.dclose{position:absolute;top:12px;right:12px;z-index:3;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(10,8,16,.6);border:1px solid var(--border);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.cmd{background:var(--bg-input);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;overflow-x:auto;margin:14px 0;white-space:pre;color:color-mix(in srgb,var(--accent) 60%,#fff)}
.dact{display:flex;gap:8px;flex-wrap:wrap}.dact .btn{flex:1 1 auto}

/* khung chờ khi đang tải */
.sk{border-radius:18px;background:linear-gradient(90deg,var(--bg-card),var(--bg-hover),var(--bg-card));background-size:200% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{to{background-position:-200% 0}}

@media(max-width:859px){
.page{grid-template-columns:1fr;gap:20px;padding:18px 14px 48px}
.side{position:static}.tabs{display:flex}.tab{flex:1;padding:9px 8px}
.links{grid-template-columns:1fr}
}

/* thẻ link: nhuốm màu thương hiệu, có mô tả và thông tin trực tiếp */
.link{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;column-gap:12px;row-gap:10px;padding:12px 14px;border-radius:16px;text-align:left;border:1px solid color-mix(in srgb,var(--bc,var(--accent)) 28%,var(--border));background:linear-gradient(135deg,color-mix(in srgb,var(--bc,var(--accent)) 15%,var(--bg-card)),var(--bg-card) 72%)}
.link::after{content:"";position:absolute;top:0;bottom:0;left:-70%;width:50%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.09),transparent);transform:skewX(-20deg);transition:left .7s ease}
.link:hover::after{left:130%}
.link:hover{box-shadow:0 12px 32px -14px var(--bc,var(--accent))}
.lk-ic{box-shadow:0 0 22px -6px var(--bc,var(--accent));overflow:hidden}
.lk-av{width:100%;height:100%;object-fit:cover}
.lk-note{grid-column:1/-1;margin:0;color:var(--text-2);font-size:13.5px;line-height:1.45}
.lk-st{grid-column:1/-1;display:flex;gap:16px;flex-wrap:wrap;color:var(--text-2);font-size:13px}
.lk-st span{display:inline-flex;align-items:center;gap:6px}
.lk-st i.on{width:8px;height:8px;border-radius:50%;background:#43b581;animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(67,181,129,.6)}70%,100%{box-shadow:0 0 0 7px rgba(67,181,129,0)}}

/* tìm kiếm, lọc, phiên bản */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sq,.ssel{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;color:var(--text);font:inherit;min-width:0}
.sq{flex:1 1 200px}.sq:focus,.ssel:focus{border-color:var(--accent)}
.fchips{display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%}
.fchip{padding:6px 14px;border-radius:99px;background:var(--bg-card);border:1px solid var(--border);color:var(--text-2);font-size:13px;font-weight:500}
.fchip.on{background:color-mix(in srgb,var(--accent) 22%,var(--bg-card));border-color:var(--accent);color:var(--text)}
.ver{position:absolute;top:10px;right:10px;z-index:2;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:rgba(10,8,16,.65);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--border)}
.chlog{margin:12px 0;padding:10px 14px;border-left:3px solid var(--accent);border-radius:0 12px 12px 0;background:color-mix(in srgb,var(--accent) 10%,transparent)}
.chlog b{font-size:13px}.chlog p{margin:4px 0 0;color:var(--text-2);font-size:14px;white-space:pre-line}
.pvh{color:var(--text-2);font-size:13px;margin-top:14px}
.pvc{margin:6px 0 0;max-height:220px;overflow:auto;color:var(--text-2)}

/* link dạng thanh dài (mặc định), có thể đổi sang lưới trong dash */
.links.list{grid-template-columns:1fr}
.links.list .link{padding:14px 18px;column-gap:14px}
.links.list .lk-ic{width:46px;height:46px}.links.list{grid-template-columns:1fr}
.links.list .link{grid-template-columns:46px minmax(0,1fr) auto}
.links.list .lk-note,.links.list .lk-st{grid-column:2/-1;margin-top:-4px}

</style>

    el('div',{class:'meta',text:s.runs+' lượt chạy, '+s.copies+' lượt copy, cập nhật '+new Date(s.updated_at).toLocaleDateString('vi-VN')}),

  if(t.kind==='social'){const box=el('div',{class:'links'+(((D.settings||{}).layout||{}).links==='grid'?'':' list')});items.forEach((l,i)=>{const href=safeUrl(l.url);if(!href)return;
    const slug=(l.icon||'').startsWith('si:')?l.icon.slice(3):'',ib=el('span',{class:'lk-ic'});
    const a=el('a',{class:'link sp rp rv',href,target:'_blank',rel:'noopener noreferrer'});
    const info=l.info,av=info&&info.icon&&safeUrl(info.icon);if(PLAT[slug])a.style.setProperty('--bc',PLAT[slug][1]);
    if(av)ib.append(el('img',{class:'lk-av',src:av,alt:'',loading:'lazy'}));else if(PLAT[slug]){const im=el('img',{class:'lk-i',src:'https://cdn.simpleicons.org/'+slug+'/white',alt:'',loading:'lazy'});im.addEventListener('error',()=>im.remove());ib.append(im)}else ib.textContent=l.icon||'🔗';
    a.append(ib,el('span',{class:'lk-tx'},el('b',{text:l.label}),el('small',{text:info?info.name:host(href)})),ic(IC.arrow,'lk-ar'));
    if(l.note)a.append(el('p',{class:'lk-note',text:l.note}));
    if(info)a.append(el('div',{class:'lk-st'},el('span',{},el('i',{class:'on'}),(info.online||0).toLocaleString('vi-VN')+' online'),el('span',{},ic(IC.users),(info.members||0).toLocaleString('vi-VN')+' thành viên')));a.style.setProperty('--i',i+2);box.append(a)});p.append(box)}
  else{const g=el('div',{class:'grid'});
    const fill=()=>{const q=F.q.trim().toLowerCase();let l=items.filter(s=>(F.st==='all'||s.status===F.st)&&(!q||(s.title+' '+(s.game||'')+' '+(s.description||'')).toLowerCase().includes(q)));
      if(F.sort==='runs')l=[...l].sort((a,b)=>b.runs-a.runs);else if(F.sort==='new')l=[...l].sort((a,b)=>b.updated_at-a.updated_at);
      g.replaceChildren(...(l.length?l.map((s,i)=>card(s,i)):[el('div',{class:'empty',style:'grid-column:1/-1',text:'Không có script nào khớp.'})]))};
    if(items.length>=3){
      const q=el('input',{class:'sq',type:'search',placeholder:'Tìm script hoặc game...','aria-label':'Tìm script'});q.value=F.q;q.addEventListener('input',()=>{F.q=q.value;fill()});
      const chips=[['all','Tất cả'],['working','Đang chạy'],['patched','Đã patch'],['outdated','Cũ']].map(([v,l])=>{const b=el('button',{class:'fchip'+(F.st===v?' on':''),type:'button',text:l,onclick:()=>{F.st=v;chips.forEach(c=>c.classList.toggle('on',c._v===v));fill()}});b._v=v;return b});
      const so=el('select',{class:'ssel','aria-label':'Sắp xếp'},...[['def','Mặc định'],['new','Mới cập nhật'],['runs','Nhiều lượt chạy']].map(([v,l])=>el('option',{value:v,text:l})));so.value=F.sort;so.addEventListener('change',()=>{F.sort=so.value;fill()});
      p.append(el('div',{class:'tools'},q,so,el('div',{class:'fchips'},...chips)))}
    p.append(g);fill()}}

function render(d){D=d;applyLook(d.settings,'bio');const pr=d.profile;$('#prof').replaceChildren(buildProfile(pr));document.title=pr.name||'NOIR';startFx(pr.effect);
  if(!TAB||!d.tabs.some(t=>t.id===TAB))TAB=(d.tabs[0]||{}).id;drawTabs();drawPanel();openFromUrl()}
$('#year').textContent=new Date().getFullYear();
fetch('/api/site').then(r=>r.json()).then(render).catch(()=>{$('#prof').textContent='Không tải được dữ liệu, thử lại sau nhé.';$('#panel').replaceChildren()});
navigator.sendBeacon&&navigator.sendBeacon('/api/hit',new Blob([JSON.stringify({ref:document.referrer})],{type:'application/json'}));
</script>
